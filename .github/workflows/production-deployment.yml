name: Vercel Production Deployment

on:
  push:
    branches:
      - main

# Serialize production deploys so an older commit can't be aliased after a newer one
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  Deploy-Production:
    uses: ./.github/workflows/deployment-template.yml
    with:
      environment: production
      build_option: --prod
    secrets: inherit
